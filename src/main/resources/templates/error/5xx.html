<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en el Servidor - 5xx</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .icon-pulse {
            animation: pulse-lock 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
            display: inline-block;
        }

        @keyframes pulse-lock {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.3));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 25px rgba(220, 38, 38, 0.6));
            }
        }

        .code-pill {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.875rem;
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid #e2e8f0;
            word-break: break-all;
        }

        .btn-home {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            transition: all 0.25s ease-in-out;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5">
                <div class="card error-card p-4 p-sm-5">
                    
                    <!-- Icono Animado -->
                    <div class="mb-3">
                        <div class="icon-pulse text-danger">
                            <i class="bi bi-shield-lock-fill display-1"></i>
                        </div>
                    </div>

                    <!-- Código de Error con Badge -->
                    <div class="mb-3">
                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-2 fw-semibold">
                            Error HTTP 5xx
                        </span>
                    </div>

                    <!-- Mensajes Principales -->
                    <h1 class="h3 fw-bold text-dark mb-2">Error en el Servidor</h1>
                    <p class="text-secondary mb-4">
                        Lo sentimos, un error interno del servidor no nos dejó darte acceso al recurso que pediste. Inténtalo más tarde.
                    </p>

                    <!-- Ruta Intentada -->
                    <div class="mb-4">
                        <small class="text-muted d-block mb-1">Ruta solicitada:</small>
                        <code class="code-pill" th:text="${path != null ? path : '/ruta-protegida'}">/admin</code>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a th:href="@{/}" class="btn btn-primary btn-home px-4 py-2 rounded-3 text-white fw-medium">
                            <i class="bi bi-house-door-fill me-2"></i>Volver al Inicio
                        </a>
                        <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-medium">
                            <i class="bi bi-arrow-left me-2"></i>Regresar
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
