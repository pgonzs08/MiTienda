<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal | E-Commerce</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <i class="bi bi-shop fs-4 text-primary"></i>
                <span>MiTienda</span>
            </a>
            <div class="d-flex gap-2">
                <a href="/catalog" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-grid-fill"></i> Catálogo
                </a>
                <a href="/cart" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-cart-fill"></i> Carrito
                </a>
                <a href="/admin" class="btn btn-warning btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-gear-fill"></i> Administración
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        
        <!-- Sección de Bienvenida (Hero Section) -->
        <div class="p-5 mb-5 bg-white rounded-4 shadow-sm border text-center">
            <div class="py-3">
                <div class="d-inline-block bg-primary-subtle text-primary p-3 rounded-circle mb-3">
                    <i class="bi bi-bag-check-fill display-5"></i>
                </div>
                <h1 class="display-5 fw-bold text-dark mb-3">Bienvenido a Nuestra Tienda Online</h1>
                <p class="col-md-8 mx-auto fs-5 text-muted mb-4">
                    Explora nuestro catálogo de productos con los mejores precios, gestiona tu carrito de compras o accede al panel de administración.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-3">
                    <a href="/catalog" class="btn btn-primary btn-lg px-4 py-2 rounded-pill fw-semibold shadow-sm d-flex align-items-center gap-2">
                        <i class="bi bi-grid-3x3-gap-fill"></i> Ver Catálogo
                    </a>
                    <a href="/cart" class="btn btn-outline-secondary btn-lg px-4 py-2 rounded-pill fw-semibold d-flex align-items-center gap-2">
                        <i class="bi bi-cart3"></i> Mi Carrito
                    </a>
                    <a href="/admin" class="btn btn-outline-warning btn-lg px-4 py-2 rounded-pill fw-semibold text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-sliders"></i> Panel Admin
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
