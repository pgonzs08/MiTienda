<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Producto</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-house-door-fill fs-5"></i>
                <span>Inicio</span>
            </a>
            <a href="/catalog" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2">
                <i class="bi bi-grid-fill"></i> Catálogo
            </a>
			<div class="d-flex align-items-center gap-2">

			    <!-- 1. Mostrar cuando el usuario SÍ está autenticado -->
			    <form th:action="@{/logout}" method="post" class="m-0" sec:authorize="isAuthenticated()">
			        <!-- Token CSRF inyectado automáticamente por Thymeleaf al usar th:action -->
			        <button type="submit" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1">
			            <i class="bi bi-box-arrow-right"></i>
			            <span>Cerrar sesión</span>
			        </button>
			    </form>

			    <!-- 2. Mostrar cuando el usuario NO está autenticado (Anónimo) -->
			    <th:block sec:authorize="isAnonymous()">
			        <a th:href="@{/login}" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1">
			            <i class="bi bi-box-arrow-in-right"></i>
			            <span>Iniciar sesión</span>
			        </a>
			        <a th:href="@{/register}" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
			            <i class="bi bi-person-plus-fill"></i>
			            <span>Registrarse</span>
			        </a>
			    </th:block>

			</div>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-primary text-white text-center py-3 rounded-top-3">
                        <h2 class="h4 mb-1 text-truncate" th:text="${product.name}">Nombre del Producto</h2>
                        <span class="badge bg-light text-primary fs-6 fw-semibold">
                            Precio actual: <span th:text="${#numbers.formatCurrency(product.price)}">0.00 €</span>
                        </span>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/catalog/update/{id}(id=${product.id})}" method="post">
							<!-- Token CSRF seguro con renderizado condicional (evita la excepción SpEL si _csrf es null) -->
							<input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="mb-3">
                                <label for="productName" class="form-label fw-bold">Nuevo nombre</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tag-fill text-secondary"></i></span>
                                    <input type="text" 
                                           id="productName" 
                                           name="name" 
                                           class="form-control" 
                                           th:value="${product.name}"
                                           th:placeholder="${product.name}" 
                                           required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="productPrice" class="form-label fw-bold">Nuevo precio (€)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-euro text-secondary"></i></span>
                                    <input type="number" 
                                           step="0.01" 
                                           min="0"
                                           id="productPrice" 
                                           name="price" 
                                           class="form-control" 
                                           th:value="${product.price}"
                                           th:placeholder="${product.price}" 
                                           required>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-2">
                                <a th:href="@{/admin}" class="btn btn-outline-secondary px-4 me-md-2">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-circle me-1"></i> Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
