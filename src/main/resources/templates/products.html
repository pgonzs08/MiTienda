<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <i class="bi bi-shop fs-4 text-primary"></i>
                <span>MiTienda</span>
            </a>
            <div class="d-flex gap-2">
                <a href="/cart" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-cart-fill"></i> Carrito
                </a>
                <a href="/admin" class="btn btn-warning btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-gear-fill"></i> Administración
                </a>
				<form th:action="@{/logout}" method="post" class="m-0">
				    <!-- Token CSRF inyectado automáticamente por Thymeleaf al usar th:action -->
				    <button type="submit" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1">
				        <i class="bi bi-box-arrow-right"></i>
				        <span>Cerrar sesión</span>
				    </button>
				</form>
            </div>
        </div>
    </nav>

    <div class="container py-3">
        
        <!-- Encabezado de Página -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
            <div>
                <h1 class="fw-bold text-dark mb-1">Catálogo de Productos</h1>
                <p class="text-muted mb-0">Explora todos los artículos disponibles en nuestra tienda.</p>
            </div>
            <div>
                <a href="/cart" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold shadow-sm d-flex align-items-center gap-2">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span>Ver Mi Carrito</span>
                </a>
            </div>
        </div>

        <!-- Vista cuando NO HAY PRODUCTOS -->
        <div th:if="${#lists.isEmpty(products)}" class="row justify-content-center my-5">
            <div class="col-12 col-md-6 text-center py-5">
                <div class="card shadow-sm border-0 p-5 rounded-4">
                    <i class="bi bi-inbox text-muted display-1 mb-3"></i>
                    <h2 class="h4 fw-bold text-dark mb-2">No hay productos disponibles</h2>
                    <p class="text-muted mb-4">Actualmente no disponemos de artículos en el catálogo.</p>
                    <div>
                        <a href="/admin" class="btn btn-outline-primary px-4 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-plus-lg me-1"></i> Añadir Productos (Admin)
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div th:unless="${#lists.isEmpty(products)}" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <div th:each="product : ${products}" class="col">
                <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">
                    
                    <!-- Marcador / Imagen de producto por defecto -->
                    <div class="bg-body-tertiary text-center py-4 border-bottom">
                        <i class="bi bi-box-seam text-secondary display-4"></i>
                    </div>

                    <div class="card-body d-flex flex-column p-4">
                        <h2 class="h5 card-title fw-bold text-dark mb-2 text-truncate" th:text="${product.name}">Nombre del Producto</h2>
                        
                        <div class="mt-auto pt-3 d-flex align-items-center justify-content-between">
                            <span class="fs-5 fw-bold text-primary" 
                                  th:text="${#numbers.formatCurrency(product.price)}">0.00 €</span>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 p-4 pt-0">
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
							<input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button type="submit" class="btn btn-outline-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2 py-2">
                                <i class="bi bi-cart-plus-fill fs-5"></i>
                                <span>Agregar al Carrito</span>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
