<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                
                <!-- Tarjeta de Registro -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5 text-center">
                        
                        <!-- Icono y Título Principal -->
                        <div class="d-inline-block bg-success-subtle text-success p-3 rounded-circle mb-3">
                            <i class="bi bi-person-plus-fill display-6"></i>
                        </div>
                        <h1 class="h3 fw-bold text-dark mb-4">Crear Cuenta</h1>

                        <!-- Mensaje de Error (Si el usuario ya existe) -->
                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-4 rounded-3 text-start" role="alert">
                            <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
                            <span class="small fw-semibold" th:text="${error}">El nombre de usuario ya existe.</span>
                        </div>

                        <!-- Formulario de Registro -->
                        <form th:action="@{/register}" method="post">
                            <!-- Token CSRF -->
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <!-- Campo: Nuevo Usuario -->
                            <div class="mb-3 text-start">
                                <label for="username" class="form-label fw-bold small text-secondary">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill text-secondary"></i></span>
                                    <input type="text" 
                                           id="username" 
                                           name="username" 
                                           class="form-control" 
                                           placeholder="Crea un nombre de usuario" 
                                           required 
                                           autofocus>
                                </div>
                            </div>

                            <!-- Campo: Nueva Contraseña -->
                            <div class="mb-4 text-start">
                                <label for="password" class="form-label fw-bold small text-secondary">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key-fill text-secondary"></i></span>
                                    <input type="password" 
                                           id="password" 
                                           name="password" 
                                           class="form-control" 
                                           placeholder="Crea una contraseña segura" 
                                           required>
                                </div>
                            </div>

                            <!-- Botón de Registro -->
                            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 rounded-3 shadow-sm mb-3">
                                <i class="bi bi-check-circle-fill fs-5"></i> Registrarse
                            </button>
                        </form>

                        <!-- Enlace de retorno al Login -->
                        <div class="pt-2 border-top">
                            <span class="small text-secondary">¿Ya tienes una cuenta?</span>
                            <a th:href="@{/login}" class="small text-decoration-none fw-bold ms-1">Inicia sesión</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
